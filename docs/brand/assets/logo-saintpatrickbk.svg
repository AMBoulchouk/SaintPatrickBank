<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="520" height="96" fill="none">
  <!-- SaintPatrickBK Official Horizontal Logo -->
  <defs>
    <linearGradient id="logo-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E54" />
      <stop offset="50%" stop-color="#FF2D20" />
      <stop offset="100%" stop-color="#D91E12" />
    </linearGradient>
    <linearGradient id="logo-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF2D20" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Isotype Badge Container -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#logo-badge-grad)" stroke="#27272a" stroke-width="1.2" />
  
  <!-- Isotype Geometric Node Mark -->
  <g filter="url(#logo-glow)">
    <path d="M24 11 L32 16 L32 22 L24 17 Z" fill="url(#logo-red-grad)" opacity="0.95" />
    <path d="M24 11 L16 16 L16 22 L24 17 Z" fill="#FF7066" opacity="0.85" />
    <polygon points="24,19 31,23.5 24,28 17,23.5" fill="#FFFFFF" opacity="0.95" />
    <path d="M16 25 L24 30 L24 36 L16 31 Z" fill="url(#logo-red-grad)" />
    <path d="M32 25 L24 30 L24 36 L32 31 Z" fill="#D91E12" />
    <circle cx="24" cy="23.5" r="2" fill="#FF2D20" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Wordmark Text: SaintPatrick in High-Contrast White, BK in Vibrant Coral Red -->
  <text x="56" y="31" font-family="Inter, Figtree, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">
    SaintPatrick<tspan fill="#FF2D20" font-weight="800">BK</tspan>
  </text>
</svg>
